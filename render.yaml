services:
  # Backend API Server
  - type: web
    name: rgclocker-backend
    env: node
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: rgclocker-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: LOCKER_JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        sync: false
        placeholder: "Genera una clave de 64 caracteres hexadecimales (32 bytes)"
      
      # Google Drive OAuth2 Credentials
      - key: GOOGLE_CLIENT_ID
        sync: false
        placeholder: "ID de cliente OAuth2 de Google"
      - key: GOOGLE_CLIENT_SECRET
        sync: false
        placeholder: "Secreto de cliente OAuth2 de Google"
      - key: GOOGLE_REFRESH_TOKEN
        sync: false
        placeholder: "Token de actualización (Refresh Token) de OAuth2 de Google"
      - key: GOOGLE_DRIVE_FOLDER_ID
        sync: false
        placeholder: "ID de la carpeta destino de Google Drive"

databases:
  - name: rgclocker-db
    plan: free
